<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlogDeCafé</title>
    <link rel="stylesheet" href="css/normalize.css">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans&family=PT+Sans:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="header">

        <div class="contenedor">
            <div class="barra">
                <a class="logo" href="index.html">
                    <h1 class="logo__nombre no-margin centrar-texto">RicoProgramar<span class="logo__bold">ConUnCafé</span></h1>
                </a>

                <nav class="navegacion">
                    <a href="nosotros.html" class="navegacion__enlace">Nosotros</a>
                    <a href="cursos.html" class="navegacion__enlace">Cursos</a>
                    <a href="contacto.html" class="navegacion__enlace">Contacto</a>
                </nav>
            </div>
        </div>

        <div class="header__texto">
            <h2 id="heading" class="no-margin">Blog de café con consejos y cursos</h2>
            <p class="no-margin">Aprende de los expertos con las mejores recetas y consejos</p>
        </div>
    </header>

    <main class="contenedor">
        <h3 class="centrar-texto">Contacto</h3>

        <div class="contacto-bg"></div>

        <form class="formulario">
            <div class="campo">
                <label class="campo__label" for="nombre">Nombre</label>
                <input 
                    class="campo__field campo__field--user-name"
                    type="text" 
                    placeholder="Tu Nombre"
                    name="userName" 
                >
            </div>

            <div class="campo">
                <label class="campo__label" for="telefono">Teléfono</label>
                <input 
                    class="campo__field campo__field--user-phone"
                    type="tel" 
                    placeholder="Tu Teléfono"
                    name="userPhone"
                >
            </div>
            
            <div class="campo">
                <label class="campo__label" for="email">E-mail</label>
                <input 
                    class="campo__field campo__field--user-email"
                    type="email" 
                    placeholder="Tu E-mail" 
                    name="userEmail"
                >
            </div>
            <div class="campo">
                <label class="campo__label" for="mensaje">Mensaje</label>
                <textarea 
                    class="campo__field campo__field--textarea campo__field--user-message"
                    name="userMessage"
                ></textarea>
            </div>

            <div class="campo">
                <input type="submit" value="Enviar" class="boton boton--primario">
            </div>
        </form>
        
        <!-- <div class="result"></div> -->
        
    </main>

    <footer class="footer">
        <div class="contenedor">
            <div class="barra">
                <a class="logo" href="index.html">
                    <h1 class="logo__nombre no-margin centrar-texto">Blog<span class="logo__bold">DeCafé</span></h1>
                </a>

                <nav class="navegacion">
                    <a href="nosotros.html" class="navegacion__enlace">Nosotros</a>
                    <a href="cursos.html" class="navegacion__enlace">Cursos</a>
                    <a href="contacto.html" class="navegacion__enlace">Contacto</a>
                </nav>
            </div>
        </div>
    </footer>

    <script>
        fetch('js/config.json')
            .then(response => response.json()) // Convierte la respuesta a JSON
            .then(data => {
                // Crea un elemento script
                const script = document.createElement('script');

                // Asigna la ruta del script desde el archivo JSON
                script.src = data.script;

                // Se indica que el script se carga después de que cargue el HTML
                script.defer = true;

                // Agrega el script al documento
                document.head.appendChild(script);
            })
            .catch(error => console.log("Error:", error));
    </script> 
</body>
</html>
